# /etc/nginx/sites-enabled/fh-bots.conf
# Telegram присылает обновления на https://<домен>/bots/orders/webhook
# nginx снимает префикс и отдаёт локальному боту: 127.0.0.1:8081/webhook
server {
    listen 443 ssl http2;
    server_name fh.example.com;

    # сертификат: sudo certbot --nginx -d fh.example.com
    ssl_certificate     /etc/letsencrypt/live/fh.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fh.example.com/privkey.pem;

    client_max_body_size 2m;

    location /bots/orders/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # второй и третий боты — по той же схеме, свои порты 8082 / 8083
}

server {
    listen 80;
    server_name fh.example.com;
    return 301 https://$host$request_uri;
}
