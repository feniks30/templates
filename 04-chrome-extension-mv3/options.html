<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MV3 Template — Настройки</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h2>Настройки</h2>
    <div class="form-field">
      <label for="inp-interval">Интервал проверки (сек.)</label>
      <input type="number" id="inp-interval" min="1" max="3600" value="60">
      <span class="field-hint">Используется фоновыми скриптами расширения.</span>
    </div>
    <div class="form-field">
      <label for="inp-target">Целевой URL (для парсера)</label>
      <input type="url" id="inp-target" placeholder="https://example.com">
      <span class="field-hint">Оставьте пустым, если не требуется.</span>
    </div>
    <div class="form-actions">
      <button type="button" id="btn-save">Сохранить</button>
      <span id="msg" class="msg"></span>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
