<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MV3 Template — Popup</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>MV3 Template</h2>
    <div class="toggle-wrap">
      <label class="toggle-label">Расширение включено</label>
      <label class="switch">
        <input type="checkbox" id="toggle-enabled">
        <span class="slider"></span>
      </label>
    </div>
    <p class="status" id="status">Загрузка состояния…</p>
    <div class="actions">
      <button type="button" id="btn-options">Открыть настройки</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
